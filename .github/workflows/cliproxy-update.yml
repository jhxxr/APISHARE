name: Update embedded CLIProxyAPI

on:
  schedule:
    # Daily at 01:41 UTC (09:41 Asia/Shanghai), off the :00 mark.
    - cron: "41 1 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Target tag (default: latest v8 release upstream)"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: cliproxy-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CGO_ENABLED: "0"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MODULE: github.com/router-for-me/CLIProxyAPI/v8
      UPSTREAM_REPO: router-for-me/CLIProxyAPI
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Resolve current and upstream versions
        id: versions
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          set -euo pipefail
          current="$(go list -m -f '{{.Version}}' "$MODULE")"
          tags="$(git ls-remote --tags --refs "https://github.com/${UPSTREAM_REPO}.git" | sed 's#.*refs/tags/##')"
          latest_v8="$(printf '%s\n' "$tags" | grep -E '^v8\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)"
          latest_any="$(printf '%s\n' "$tags" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)"
          latest_major=""
          if [ -n "$latest_any" ]; then
            latest_major="$(printf '%s\n' "$latest_any" | sed -E 's/^v([0-9]+).*/\1/')"
          fi
          target="${REQUESTED:-$latest_v8}"
          if [ -z "$target" ] || ! printf '%s\n' "$tags" | grep -qx "$target"; then
            echo "::error::Upstream tag '$target' was not found"
            exit 1
          fi
          {
            echo "current=${current}"
            echo "target=${target}"
            echo "latest_v8=${latest_v8}"
            echo "latest_major=${latest_major}"
            if [ "$current" = "$target" ]; then
              echo "update_needed=false"
            else
              echo "update_needed=true"
            fi
          } >> "$GITHUB_OUTPUT"
          {
            echo "### CLIProxyAPI 版本检查"
            echo ""
            echo "| 项目 | 版本 |"
            echo "| --- | --- |"
            echo "| 当前 go.mod | \`${current}\` |"
            echo "| 上游最新 v8 | \`${latest_v8}\` |"
            echo "| 本次目标 | \`${target}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Show release notes between current and target
        id: notes
        if: steps.versions.outputs.update_needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT: ${{ steps.versions.outputs.current }}
          TARGET: ${{ steps.versions.outputs.target }}
        run: |
          set -euo pipefail
          notes_file="${RUNNER_TEMP}/release-notes.md"
          commits_file="${RUNNER_TEMP}/upstream-commits.md"
          if ! gh api --method GET "repos/${UPSTREAM_REPO}/releases/tags/${TARGET}" \
               --jq '.body // empty' > "$notes_file" 2>/dev/null; then
            : > "$notes_file"
          fi
          if ! gh api --method GET "repos/${UPSTREAM_REPO}/compare/${CURRENT}...${TARGET}" \
               -f per_page=100 --paginate \
               --jq '.commits[] | "- [\(.sha[0:7])](\(.html_url)) \(.commit.message | split("\n")[0])"' \
               > "$commits_file"; then
            : > "$commits_file"
            echo "::warning::Unable to read upstream commits; see the comparison link in the summary."
          fi
          {
            echo "### 上游变更摘要（${CURRENT} → ${TARGET}）"
            echo ""
            echo "[完整提交对比](https://github.com/${UPSTREAM_REPO}/compare/${CURRENT}...${TARGET}) · [目标版本发布说明](https://github.com/${UPSTREAM_REPO}/releases/tag/${TARGET})"
            echo ""
            if [ -s "$notes_file" ]; then
              echo "#### 目标版本发布说明"
              echo ""
              cat "$notes_file"
              echo ""
            fi
            if [ -s "$commits_file" ]; then
              echo "#### 版本间提交"
              echo ""
              cat "$commits_file"
            else
              echo "未获取到版本间新增提交，请通过上方链接核对完整变更。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Bump dependency, build and test
        id: verify
        if: steps.versions.outputs.update_needed == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/cliproxy-verify.log"
          {
            echo '$ go get ${MODULE}@${{ steps.versions.outputs.target }}'
            go get "${MODULE}@${{ steps.versions.outputs.target }}"
            echo
            echo '$ go mod tidy'
            go mod tidy
            module_dir="$(go list -m -f '{{.Dir}}' "$MODULE")"
            if [ -f "${module_dir}/LICENSE" ]; then
              cp "${module_dir}/LICENSE" cmd/apishare/third_party/cliproxy/LICENSE
            fi
            echo
            echo '$ go test ./... -count=1'
            go test ./... -count=1
            echo
            echo '$ go build -trimpath ./cmd/apishare'
            go build -trimpath -o "${RUNNER_TEMP}/apishare" ./cmd/apishare
            echo
            echo '$ git diff --stat'
            git --no-pager diff --stat
          } 2>&1 | tee "$log"

      - name: Push branch and open pull request
        id: publish
        if: steps.versions.outputs.update_needed == 'true' && steps.verify.outcome == 'success'
        env:
          CURRENT: ${{ steps.versions.outputs.current }}
          TARGET: ${{ steps.versions.outputs.target }}
        run: |
          set -euo pipefail
          branch="chore/cliproxy-${TARGET}"
          remote_ref="$(git ls-remote --heads origin "refs/heads/${branch}")"
          if [ -n "$remote_ref" ]; then
            echo "::notice::Upgrade branch ${branch} already exists; preserving all existing commits."
            {
              echo "### 已保留现有升级分支"
              echo ""
              echo "分支 \`${branch}\` 已存在，本次跳过推送并保留全部提交。请继续评审现有 PR，或从[分支比较](https://github.com/${GITHUB_REPOSITORY}/compare/${DEFAULT_BRANCH}...${branch}?expand=1) 创建 PR。"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add go.mod go.sum cmd/apishare/third_party/cliproxy/LICENSE
          if git diff --cached --quiet; then
            echo "No file changes after bump; nothing to publish."
            exit 0
          fi
          git commit -m "chore(cliproxy): 升级内置 CLIProxyAPI 至 ${TARGET}"
          git push --set-upstream origin "$branch"

          pr_number="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')"
          if [ -n "$pr_number" ]; then
            echo "Pull request #${pr_number} already tracks ${branch}."
            exit 0
          fi

          cat > "${RUNNER_TEMP}/pr-body.md" <<'EOF'
          ## 内置 CLIProxyAPI 升级

          - 当前版本：`__CURRENT__`
          - 目标版本：`__TARGET__`
          - 上游变更：https://github.com/__UPSTREAM__/releases/tag/__TARGET__

          由 `.github/workflows/cliproxy-update.yml` 自动生成。依赖版本与适配改动应随同一提交评审。

          ### 自动验证

          - [x] `go test ./... -count=1`
          - [x] `go build -trimpath ./cmd/apishare`

          ### 合并前人工回归（对应 docs/CLIPROXY.md）

          - [ ] OAuth 登录与令牌刷新
          - [ ] 原生工具调用
          - [ ] 流式取消
          - [ ] usage 口径与计费统计
          - [ ] 账号池启停与管理 API
          EOF
          sed -i \
            -e "s|__CURRENT__|${CURRENT}|g" \
            -e "s|__TARGET__|${TARGET}|g" \
            -e "s|__UPSTREAM__|${UPSTREAM_REPO}|g" \
            "${RUNNER_TEMP}/pr-body.md"

          if gh pr create --base "$DEFAULT_BRANCH" --head "$branch" \
               --title "chore(cliproxy): 升级内置 CLIProxyAPI 至 ${TARGET}" \
               --body-file "${RUNNER_TEMP}/pr-body.md"; then
            exit 0
          fi

          # GITHUB_TOKEN may not be allowed to open pull requests (repository setting).
          # Fall back to an issue assigned to the maintainer, with a compare link.
          echo "::warning::Unable to open a pull request with GITHUB_TOKEN; falling back to an issue."
          cat > "${RUNNER_TEMP}/ready-body.md" <<'EOF'
          ## 内置 CLIProxyAPI 升级已验证通过

          - 当前版本：`__CURRENT__`
          - 目标版本：`__TARGET__`
          - 分支：`__BRANCH__`
          - 上游变更：https://github.com/__UPSTREAM__/releases/tag/__TARGET__

          `go test ./... -count=1` 与 `go build ./cmd/apishare` 均通过，分支已推送。

          请打开并审阅 PR：
          https://github.com/__REPO__/compare/__BASE__...__BRANCH__?expand=1

          若希望后续自动创建 PR，请在仓库 Settings → Actions → General →
          Workflow permissions 中开启 “Allow GitHub Actions to create and approve pull requests”。

          合并前请按 `docs/CLIPROXY.md` 回归 OAuth、原生工具调用、流式取消与 usage 口径。
          EOF
          sed -i \
            -e "s|__CURRENT__|${CURRENT}|g" \
            -e "s|__TARGET__|${TARGET}|g" \
            -e "s|__BRANCH__|${branch}|g" \
            -e "s|__UPSTREAM__|${UPSTREAM_REPO}|g" \
            -e "s|__REPO__|${GITHUB_REPOSITORY}|g" \
            -e "s|__BASE__|${DEFAULT_BRANCH}|g" \
            "${RUNNER_TEMP}/ready-body.md"
          title="内置 CLIProxyAPI ${TARGET} 已验证，待创建 PR"
          existing="$(gh issue list --state open --search "in:title CLIProxyAPI ${TARGET} 已验证" --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file "${RUNNER_TEMP}/ready-body.md"
          else
            gh label create cliproxy-upgrade --color "FBCA04" --description "内置 CLIProxyAPI 升级" >/dev/null 2>&1 || true
            gh issue create --title "$title" --body-file "${RUNNER_TEMP}/ready-body.md" \
              --assignee "${{ github.repository_owner }}" --label cliproxy-upgrade
          fi

      - name: Open adaptation issue when verification fails
        id: adaptation
        if: steps.versions.outputs.update_needed == 'true' && steps.verify.outcome == 'failure'
        env:
          CURRENT: ${{ steps.versions.outputs.current }}
          TARGET: ${{ steps.versions.outputs.target }}
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/adapt-body.md" <<'EOF'
          ## 内置 CLIProxyAPI 自动升级需要适配

          自动更新 `__CURRENT__` → `__TARGET__` 后，`go test ./...` 或 `go build ./cmd/apishare` 失败。

          - 上游变更：https://github.com/__UPSTREAM__/releases/tag/__TARGET__
          - 运行日志：见本次 Actions 运行的 “Bump dependency, build and test” 步骤及下方摘要。

          ### 失败输出（末尾 120 行）

          ```text
          __LOG__
          ```

          ### 处理建议

          1. 在本地执行 `go get __MODULE__@__TARGET__ && go mod tidy` 复现。
          2. 按错误修改 `internal/cliproxy` 或 `cmd/apishare/cliproxy.go` 的适配层；不要修改上游源码。
          3. 通过 `go test ./...` 后提交升级与适配改动。
          EOF
          python3 - "$RUNNER_TEMP/adapt-body.md" "$CURRENT" "$TARGET" "$UPSTREAM_REPO" "$MODULE" "${RUNNER_TEMP}/cliproxy-verify.log" <<'PY'
          import pathlib
          import sys

          body_path, current, target, upstream, module, log_path = sys.argv[1:]
          body = pathlib.Path(body_path).read_text(encoding="utf-8")
          try:
              lines = pathlib.Path(log_path).read_text(encoding="utf-8", errors="replace").splitlines()
          except FileNotFoundError:
              lines = ["(no log captured)"]
          excerpt = "\n".join(lines[-120:])
          body = (
              body.replace("__CURRENT__", current)
              .replace("__TARGET__", target)
              .replace("__UPSTREAM__", upstream)
              .replace("__MODULE__", module)
              .replace("__LOG__", excerpt)
          )
          pathlib.Path(body_path).write_text(body, encoding="utf-8")
          PY
          title="内置 CLIProxyAPI ${TARGET} 自动升级失败，需要人工适配"
          existing="$(gh issue list --state open --search "in:title CLIProxyAPI ${TARGET} 自动升级失败" --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file "${RUNNER_TEMP}/adapt-body.md"
          else
            gh label create cliproxy-upgrade --color "FBCA04" --description "内置 CLIProxyAPI 升级" >/dev/null 2>&1 || true
            gh issue create --title "$title" --body-file "${RUNNER_TEMP}/adapt-body.md" \
              --assignee "${{ github.repository_owner }}" --label cliproxy-upgrade
          fi

      - name: Open issue when upstream bumps the major version
        if: steps.versions.outputs.latest_major != '' && steps.versions.outputs.latest_major != '8'
        env:
          LATEST_MAJOR: ${{ steps.versions.outputs.latest_major }}
          LATEST_V8: ${{ steps.versions.outputs.latest_v8 }}
          CURRENT: ${{ steps.versions.outputs.current }}
        run: |
          set -euo pipefail
          title="内置 CLIProxyAPI v${LATEST_MAJOR} 大版本升级，需要人工适配"
          existing="$(gh issue list --state open --search "in:title CLIProxyAPI v${LATEST_MAJOR} 大版本升级" --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            echo "Open adaptation issue #${existing} already covers v${LATEST_MAJOR}."
            exit 0
          fi
          cat > "${RUNNER_TEMP}/major-body.md" <<'EOF'
          上游 CLIProxyAPI 已发布新的大版本 `v__LATEST_MAJOR__`。

          - 当前内置版本：`__CURRENT__`
          - 上游最新 v8：`__LATEST_V8__`
          - 上游标签：https://github.com/__UPSTREAM__/tags

          模块路径很可能从 `.../CLIProxyAPI/v8` 变为 `.../CLIProxyAPI/v9`，SDK 公共接口、管理 API 与配置格式也可能变化，因此工作流不会自动升级。

          ### 处理建议

          1. 阅读上游 v__LATEST_MAJOR__ 的迁移说明与 release notes。
          2. 新建分支，将 import 路径和 `go.mod` 模块路径迁移到 v__LATEST_MAJOR__。
          3. 适配 `internal/cliproxy` 与 `cmd/apishare/cliproxy.go`，完整跑 `go test ./...`。
          4. 按 `docs/CLIPROXY.md` 回归 OAuth、原生工具调用、流式取消、usage 口径和账号池启停。
          EOF
          sed -i \
            -e "s|__LATEST_MAJOR__|${LATEST_MAJOR}|g" \
            -e "s|__LATEST_V8__|${LATEST_V8}|g" \
            -e "s|__CURRENT__|${CURRENT}|g" \
            -e "s|__UPSTREAM__|${UPSTREAM_REPO}|g" \
            "${RUNNER_TEMP}/major-body.md"
          gh label create cliproxy-upgrade --color "FBCA04" --description "内置 CLIProxyAPI 升级" >/dev/null 2>&1 || true
          gh issue create --title "$title" --body-file "${RUNNER_TEMP}/major-body.md" \
            --assignee "${{ github.repository_owner }}" --label cliproxy-upgrade
